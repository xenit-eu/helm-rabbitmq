{{- if .Values.networkPolicy.enabled }}
{{- $hasCilium := .Capabilities.APIVersions.Has "cilium.io/v2" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helm-rabbitmq.fullname" . }}
  labels:
    {{- include "helm-rabbitmq.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "helm-rabbitmq.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Internal communications between nodes
    - from:
        - podSelector:
            matchLabels:
              {{- include "helm-rabbitmq.selectorLabels" . | nindent 14 }}
  egress:
    # Internal communications between nodes
    - to:
        - podSelector:
            matchLabels:
              {{- include "helm-rabbitmq.selectorLabels" . | nindent 14 }}
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # kube-apiserver
    {{- if and (not $hasCilium) .Values.networkPolicy.kubeAPIServerCIDRs .Values.networkPolicy.kubeAPIServerPorts }}
    - ports:
      {{- range .Values.networkPolicy.kubeAPIServerPorts }}
        - port: {{ . }}
      {{- end }}
      to:
      {{- range .Values.networkPolicy.kubeAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
    {{- end }}
---
{{- if $hasCilium }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "helm-rabbitmq.fullname" . }}
  labels:
    {{- include "helm-rabbitmq.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "helm-rabbitmq.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
{{- end }}
{{- end }}
