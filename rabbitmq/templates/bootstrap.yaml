{{- if .Values.bootstrap.enabled -}}
apiVersion: v1
kind: ServiceAccount
{{ include "rabbitmq.bootstrap.metadata" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
{{ include "rabbitmq.bootstrap.metadata" . }}
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
  resourceNames:
    - {{ include "rabbitmq.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
{{ include "rabbitmq.bootstrap.metadata" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rabbitmq.bootstrap.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "rabbitmq.bootstrap.name" . }}
---
apiVersion: batch/v1
kind: Job
{{ include "rabbitmq.bootstrap.metadata" . }}
spec:
  template:
    metadata:
      labels:
        {{- include "rabbitmq.bootstrap.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "rabbitmq.bootstrap.name" . }}
      containers:
        - name: bootstrap-rabbitmq
          image: {{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}
          {{- with .Values.bootstrap.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if ! kubectl get secret "{{ include "rabbitmq.fullname" . }}" > /dev/null; then
                kubectl create secret generic "{{ include "rabbitmq.fullname" . }}" --from-literal="password={{ randAlphaNum 16 }}" --from-literal="erlang-cookie={{ randAlphaNum 32 }}"
              fi
{{- if .Values.networkPolicy.enabled }}
{{- $hasCilium := .Capabilities.APIVersions.Has "cilium.io/v2" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rabbitmq.bootstrap.name" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "rabbitmq.bootstrap.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rabbitmq.bootstrap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # kube-apiserver
    {{- if and (not $hasCilium) .Values.networkPolicy.kubeAPIServerCIDRs .Values.networkPolicy.kubeAPIServerPorts }}
    - ports:
      {{- range .Values.networkPolicy.kubeAPIServerPorts }}
        - port: {{ . }}
      {{- end }}
      to:
      {{- range .Values.networkPolicy.kubeAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
    {{- end }}
---
{{ if $hasCilium }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "rabbitmq.bootstrap.name" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "rabbitmq.bootstrap.selectorLabels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "rabbitmq.bootstrap.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
{{- end }}
{{- end }}
{{- end }}
