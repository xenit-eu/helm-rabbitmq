# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 3

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: rabbitmq
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Sets the digest for the image
  digest: ~

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Security context for the RabbitMQ pod.
podSecurityContext: {}
  # fsGroup: 2000

# Security context for the RabbitMQ container.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output StatefulSet definition.
additionalVolumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output StatefulSet definition.
additionalVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Node selector for the RabbitMQ pods.
nodeSelector: {}

# Tolerations for the RabbitMQ pods.
tolerations: []

# Affinity rules for the RabbitMQ pods.
affinity: {}

persistence:
  # Storage class for the RabbitMQ data volume. Defaults to the cluster default.
  storageClassName: ""
  # Size of the RabbitMQ data volume.
  size: 8Gi

# Configuration for the bootstrap job that creates the RabbitMQ credentials secret.
bootstrap:
  enabled: true # Set to false to disable bootstrapping RabbitMQ secrets. You will have to create the secret yourself
  image:
    repository: ghcr.io/xenit-eu/kubectl
    tag: latest
  # Resource requests and limits for the bootstrap job container.
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# RabbitMQ configuration file content, injected via ConfigMap.
configuration: ""

podDisruptionBudget:
  # Enable a PodDisruptionBudget for the RabbitMQ StatefulSet.
  enabled: true
  # Minimum number of pods that must be available during disruptions.
  # Mutually exclusive with maxUnavailable.
  # minAvailable: 1
  # Maximum number of pods that can be unavailable during disruptions.
  # Mutually exclusive with minAvailable.
  maxUnavailable: 1

networkPolicy:
  # Enable network policies
  enabled: true
  # CIDRs of the kube-apiserver, required for RabbitMQ to reach the API server to discover cluster members.
  # Not needed when Cilium is installed
  kubeAPIServerCIDRs: []
  # Ports the kube-apiserver listens on.
  kubeAPIServerPorts: [443, 6443, 8443]
