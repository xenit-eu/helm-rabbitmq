on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ubuntu-latest-4-cores
    defaults:
      run:
        working-directory: ./test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 21
          cache: gradle
      - run: ./gradlew check --info -PdisableDockerRegistryCache=true
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package & publish
        run: |
          chart_version=${GITHUB_REF#refs/tags/v}
          helm package rabbitmq --dependency-update --version "$chart_version"
          helm push "rabbitmq-${chart_version}.tgz" oci://ghcr.io/xenit-eu
